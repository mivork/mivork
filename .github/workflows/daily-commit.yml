name: Daily Contribution

on:
  schedule:
    # GitHub Actions cron runs in UTC: 00,05,10,15,20 UTC = 09:00, 14:00, 19:00, 00:00, 05:00 JST (5 runs/day)
    - cron: "0 0,5,10,15,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-contribution
  cancel-in-progress: false

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record activity
        run: |
          mkdir -p activity
          echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> activity/log.txt

      - name: Commit and push
        env:
          # Commits must use an email linked to your GitHub account to appear on the graph.
          # github-actions[bot] commits do not count.
          # Recommended: <numeric-id>+mivork@users.noreply.github.com
          # (numeric id: https://api.github.com/users/mivork -> "id")
          AUTHOR_EMAIL: ${{ secrets.GIT_AUTHOR_EMAIL }}
        run: |
          git config user.name "mivork"
          git config user.email "$AUTHOR_EMAIL"
          git add activity/log.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily activity $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
